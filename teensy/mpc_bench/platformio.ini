; Ideal-model closed-loop MPC bench and TinyMPC knot sweep (src/main.cpp; x86 build in host/). Build only: `pio run -e <env>`.
;   ours : our tier 1 (Solver) and tier 2 (StateSolver) closed loops, caps 100 and 5, plus the per-N one-shot/closed loop
;   tiny : TinyMPC 0.0.8 closed loops (max_iter 1000/100/5, raw and clamped u) and the knot sweep N = 10..90
;   both : both solvers in one image (the sweep then prints our optimum next to TinyMPC's plan)
; Only TINY's x0 runs on the board (-DBENCH_NX0=11 for all 11). The data header is generated by gen_data.py.
[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
lib_extra_dirs = ../tinympc_size/lib
build_flags = -DNDEBUG -DTINY_NO_IO -I../../develop/cpp -I/home/intsyslab/OCP-MPC/compare/third_party/TinyMPC-0.0.8/include/Eigen
    -DLQOCP_FLASH=PROGMEM -DLQOCP_NSD=4

[env:ours]
build_flags = ${env.build_flags} -DBENCH_OURS
lib_ignore = tinympc

[env:tiny]
build_flags = ${env.build_flags} -DBENCH_TINY

[env:both]
build_flags = ${env.build_flags} -DBENCH_OURS -DBENCH_TINY
