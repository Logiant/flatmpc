; Build-only memory measurement of TinyMPC 0.0.8 (lib/tinympc, copied, tinytype switchable) on Teensy 4.1.
[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -DNDEBUG -I/home/intsyslab/OCP-MPC/compare/third_party/TinyMPC-0.0.8/include/Eigen

[env:baseline]
lib_ignore = tinympc

[env:tiny_double]
build_flags = ${env.build_flags} -DWITH_TINY -fstack-usage -fcallgraph-info=su

[env:tiny_float]
build_flags = ${env.build_flags} -DWITH_TINY -DTINY_FLOAT -fstack-usage -fcallgraph-info=su

; Same, with TinyMPC's std::cout diagnostics compiled out (lib/tinympc/src/tiny_io.h).
[env:tiny_double_noio]
build_flags = ${env:tiny_double.build_flags} -DTINY_NO_IO

[env:tiny_float_noio]
build_flags = ${env:tiny_float.build_flags} -DTINY_NO_IO
