; Size-only builds (no hardware, no upload) of the energy path and TinyMPC 0.0.8 on other cores.
; Same toolchain as the Teensy builds (Arm GNU 15.2: the teensy package symlinked under the name toolchain-gccarmnoneeabi), STM32Cube framework.
;   base   : empty main (reference); ours_d/ours_f: energy path double/float; tiny_d/tiny_f: TinyMPC double/float
;   g0 = nucleo_g071rb (Cortex-M0+, no FPU), g4 = nucleo_g431kb (Cortex-M4F, single-precision FPU)
;   g4 adds -mfpu=fpv4-sp-d16 -mfloat-abi=hard (PlatformIO's stm32cube builds soft-float otherwise)
;   suffix _o2: -O2 instead of the default -Os
; Results: RESULTS.md (sizes.py prints the table).
[env]
platform = ststm32
framework = stm32cube
platform_packages = toolchain-gccarmnoneeabi@symlink:///home/intsyslab/.platformio/packages/toolchain-gccarmnoneeabi-15.2-sym
build_flags = -DNDEBUG -fno-exceptions -fcallgraph-info=su
    -I../../develop/cpp -I../lqocp_bench/src -DLQOCP_FLASH= -DLQOCP_NO_TAU -DLQOCP_NSD=4
    -DQ_ZERO -DNO_XBOUND -DTINY_NO_IO -I/home/intsyslab/OCP-MPC/compare/third_party/TinyMPC-0.0.8/include/Eigen

[env:g0_base]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_BASE

[env:g0_ours_d]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_OURS

[env:g0_ours_f]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_OURS -DLQOCP_FLOAT
extra_scripts = pre:single_const.py

[env:g0_tiny_d]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_TINY

[env:g0_tiny_f]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_TINY -DTINY_FLOAT

[env:g0_base_o2]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_BASE -O2
build_unflags = -Os

[env:g0_ours_d_o2]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_OURS -O2
build_unflags = -Os

[env:g0_ours_f_o2]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_OURS -DLQOCP_FLOAT -O2
build_unflags = -Os
extra_scripts = pre:single_const.py

[env:g0_tiny_d_o2]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_TINY -O2
build_unflags = -Os

[env:g0_tiny_f_o2]
board = nucleo_g071rb
build_flags = ${env.build_flags} -DPROG_TINY -DTINY_FLOAT -O2
build_unflags = -Os

[env:g4_base]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_BASE
extra_scripts = hardfloat.py

[env:g4_ours_d]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_OURS
extra_scripts = hardfloat.py

[env:g4_ours_f]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_OURS -DLQOCP_FLOAT
extra_scripts = pre:single_const.py, hardfloat.py

[env:g4_tiny_d]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_TINY
extra_scripts = hardfloat.py

[env:g4_tiny_f]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_TINY -DTINY_FLOAT
extra_scripts = hardfloat.py

[env:g4_base_o2]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_BASE -O2
build_unflags = -Os
extra_scripts = hardfloat.py

[env:g4_ours_d_o2]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_OURS -O2
build_unflags = -Os
extra_scripts = hardfloat.py

[env:g4_ours_f_o2]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_OURS -DLQOCP_FLOAT -O2
build_unflags = -Os
extra_scripts = pre:single_const.py, hardfloat.py

[env:g4_tiny_d_o2]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_TINY -O2
build_unflags = -Os
extra_scripts = hardfloat.py

[env:g4_tiny_f_o2]
board = nucleo_g431kb
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard -DPROG_TINY -DTINY_FLOAT -O2
build_unflags = -Os
extra_scripts = hardfloat.py
