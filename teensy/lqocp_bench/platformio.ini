; lqocp on Teensy 4.1. Same Serial/micros boilerplate in every env.
;   baseline     : no solver (reference for the size increments)
;   tiny_double  : general-cost solver, TINY cold solve + MPC closed loop (16 arcs, no stored relations, 4 sensitivity columns)
;   tiny_float   : same with float Jacobian/sensitivity storage (-DLQOCP_FLOAT)
;   tiny_fast    : as tiny_double plus 4 stored relations (less recomputation, more RAM)
;   energy       : energy-cost solver, cases A and B, TINY with Q = 0 (cold + MPC closed loop, caps 100 and 5); tier 1 only (LQOCP_NO_STATE)
;   energy_float : same in float (-DLQOCP_FLOAT; literals single precision)
;   tier2        : tier 2 (StateSolver): TINY with Q = 0 and |x_phys| <= 5 (cold + MPC closed loop, caps 100 and 5)
; Regenerate src/bench_data.h with develop/cpp: make teensy_table
[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -DNDEBUG -I../../develop/cpp -DLQOCP_FLASH=PROGMEM -DLQOCP_NSD=4 -fstack-usage -fcallgraph-info=su

[env:baseline]

[env:tiny_double]
build_flags = ${env.build_flags} -DBENCH_TINY -DLQOCP_NA=16 -DLQOCP_NCK=1 -DLQOCP_NB=4

[env:tiny_float]
build_flags = ${env:tiny_double.build_flags} -DLQOCP_FLOAT

[env:tiny_fast]
build_flags = ${env.build_flags} -DBENCH_TINY -DLQOCP_NA=16 -DLQOCP_NCK=4 -DLQOCP_NB=4

[env:energy]
build_flags = ${env.build_flags} -DBENCH_ENERGY -DLQOCP_NO_STATE

[env:energy_float]
build_flags = ${env:energy.build_flags} -DLQOCP_FLOAT
extra_scripts = pre:single_const.py
[env:tier2]
build_flags = ${env.build_flags} -DBENCH_TIER2
; profiling builds (-DLQOCP_PROF: DWT scoped accumulators, lqocp_prof.hpp); without the flag the envs above are unchanged
[env:tiny_double_prof]
build_flags = ${env:tiny_double.build_flags} -DLQOCP_PROF
[env:tiny_fast_prof]
build_flags = ${env:tiny_fast.build_flags} -DLQOCP_PROF
[env:energy_prof]
build_flags = ${env:energy.build_flags} -DLQOCP_PROF
[env:tier2_prof]
build_flags = ${env:tier2.build_flags} -DLQOCP_PROF
; diagnostic: tiny_double with the basis table and problem data in RAM1 (no LQOCP_FLASH: const data is copied to DTCM)
[env:tiny_double_ram]
build_flags = -DNDEBUG -I../../develop/cpp -DLQOCP_NSD=4 -DBENCH_TINY -DLQOCP_NA=16 -DLQOCP_NCK=1 -DLQOCP_NB=4
[env:tiny_double_ram_prof]
build_flags = ${env:tiny_double_ram.build_flags} -DLQOCP_PROF
