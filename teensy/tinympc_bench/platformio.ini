; TinyMPC 0.0.8 (no-iostream, copied from ../tinympc_size) solve-time benchmark on Teensy 4.1.
[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -DNDEBUG -DTINY_NO_IO -I/home/intsyslab/OCP-MPC/compare/third_party/TinyMPC-0.0.8/include/Eigen

[env:double]

[env:float]
build_flags = ${env.build_flags} -DTINY_FLOAT

[env:double_q0]
build_flags = ${env.build_flags} -DQ_ZERO

[env:double_q0_nox]
build_flags = ${env.build_flags} -DQ_ZERO -DNO_XBOUND

[env:float_q0_nox]
build_flags = ${env.build_flags} -DTINY_FLOAT -DQ_ZERO -DNO_XBOUND
